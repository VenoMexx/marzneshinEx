<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Control Panel - Marzneshin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        h2 {
            color: #555;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c00;
        }

        .success {
            background: #efe;
            color: #0a0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0a0;
        }

        .hidden {
            display: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .subscription-links {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sub-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .sub-link-label {
            font-weight: 600;
            color: #555;
        }

        .sub-link-btn {
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .sub-link-btn:hover {
            background: #5568d3;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
        }

        .qr-code {
            max-width: 300px;
            margin: 0 auto;
        }

        .logout-btn {
            background: #dc3545;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginForm" class="card">
            <h1>🔐 User Control Panel</h1>
            <p class="subtitle">Access your account information and configurations</p>

            <div id="loginError" class="error hidden"></div>

            <form onsubmit="login(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="subscriptionKey">Subscription Key</label>
                    <input type="text" id="subscriptionKey" required placeholder="Your subscription key from URL">
                    <small style="color: #666; margin-top: 5px; display: block;">
                        Find this in your subscription URL: /sub/<strong>YOUR_KEY</strong>/...
                    </small>
                </div>

                <button type="submit" id="loginBtn">Login</button>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <!-- Account Status -->
            <div class="card">
                <h2>📊 Account Status</h2>
                <div id="accountInfo"></div>
            </div>

            <!-- Subscription Links -->
            <div class="card">
                <h2>🔗 Subscription Links</h2>
                <div class="subscription-links" id="subscriptionLinks"></div>
            </div>

            <!-- QR Codes -->
            <div class="card">
                <h2>📱 QR Codes</h2>
                <div id="qrSection">
                    <div class="subscription-links">
                        <div class="sub-link">
                            <span class="sub-link-label">V2Ray / Xray</span>
                            <button class="sub-link-btn" onclick="showQR('v2ray')">Show QR</button>
                        </div>
                        <div class="sub-link">
                            <span class="sub-link-label">Clash</span>
                            <button class="sub-link-btn" onclick="showQR('clash')">Show QR</button>
                        </div>
                        <div class="sub-link">
                            <span class="sub-link-label">Clash Meta</span>
                            <button class="sub-link-btn" onclick="showQR('clash-meta')">Show QR</button>
                        </div>
                        <div class="sub-link">
                            <span class="sub-link-label">Sing-Box</span>
                            <button class="sub-link-btn" onclick="showQR('singbox')">Show QR</button>
                        </div>
                    </div>

                    <div id="qrDisplay" class="qr-container hidden">
                        <img id="qrImage" class="qr-code" alt="QR Code">
                    </div>
                </div>
            </div>

            <!-- Logout -->
            <div class="card">
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/user-panel';
        let accessToken = null;

        // Load token from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            accessToken = localStorage.getItem('user_panel_token');
            if (accessToken) {
                loadDashboard();
            }
        });

        async function login(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const subscriptionKey = document.getElementById('subscriptionKey').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch(`${API_BASE}/auth`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        subscription_key: subscriptionKey
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                accessToken = data.access_token;
                localStorage.setItem('user_panel_token', accessToken);

                await loadDashboard();

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        async function loadDashboard() {
            try {
                // Hide login form, show dashboard
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');

                // Load user info
                await loadUserInfo();

                // Load subscription links
                await loadSubscriptionLinks();

            } catch (error) {
                console.error('Failed to load dashboard:', error);
                logout();
            }
        }

        async function loadUserInfo() {
            const response = await fetch(`${API_BASE}/me`, {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to load user info');
            }

            const user = await response.json();

            // Format bytes
            const formatBytes = (bytes) => {
                if (bytes === null) return 'Unlimited';
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                let size = bytes;
                let unitIndex = 0;
                while (size >= 1024 && unitIndex < units.length - 1) {
                    size /= 1024;
                    unitIndex++;
                }
                return `${size.toFixed(2)} ${units[unitIndex]}`;
            };

            // Format date
            const formatDate = (dateStr) => {
                if (!dateStr) return 'Never';
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            };

            // Build account info HTML
            const accountInfo = document.getElementById('accountInfo');
            accountInfo.innerHTML = `
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Username</div>
                        <div class="info-value">${user.username}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value">
                            <span class="status-badge ${user.is_active ? 'status-active' : 'status-inactive'}">
                                ${user.is_active ? '✓ Active' : '✗ Inactive'}
                            </span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Used Traffic</div>
                        <div class="info-value">${formatBytes(user.used_traffic)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Traffic Limit</div>
                        <div class="info-value">${formatBytes(user.data_limit)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Remaining Traffic</div>
                        <div class="info-value">${formatBytes(user.remaining_traffic)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Expire Date</div>
                        <div class="info-value">${formatDate(user.expire_date)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Days Remaining</div>
                        <div class="info-value">${user.days_remaining !== null ? user.days_remaining + ' days' : 'N/A'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Created At</div>
                        <div class="info-value">${formatDate(user.created_at)}</div>
                    </div>
                </div>
                ${user.usage_percentage !== null ? `
                    <div>
                        <div class="info-label">Traffic Usage</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(user.usage_percentage, 100)}%">
                                ${user.usage_percentage.toFixed(1)}%
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        async function loadSubscriptionLinks() {
            const response = await fetch(`${API_BASE}/subscription-links`, {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to load subscription links');
            }

            const links = await response.json();

            const subscriptionLinks = document.getElementById('subscriptionLinks');
            subscriptionLinks.innerHTML = `
                <div class="sub-link">
                    <span class="sub-link-label">V2Ray / Xray</span>
                    <button class="sub-link-btn" onclick="copyToClipboard('${links.v2ray}')">Copy Link</button>
                </div>
                <div class="sub-link">
                    <span class="sub-link-label">Clash</span>
                    <button class="sub-link-btn" onclick="copyToClipboard('${links.clash}')">Copy Link</button>
                </div>
                <div class="sub-link">
                    <span class="sub-link-label">Clash Meta</span>
                    <button class="sub-link-btn" onclick="copyToClipboard('${links.clash_meta}')">Copy Link</button>
                </div>
                <div class="sub-link">
                    <span class="sub-link-label">Sing-Box</span>
                    <button class="sub-link-btn" onclick="copyToClipboard('${links.singbox}')">Copy Link</button>
                </div>
            `;
        }

        async function showQR(format) {
            const qrDisplay = document.getElementById('qrDisplay');
            const qrImage = document.getElementById('qrImage');

            // Fetch QR code with authorization
            const response = await fetch(`${API_BASE}/qr/${format}`, {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            if (response.ok) {
                const blob = await response.blob();
                qrImage.src = URL.createObjectURL(blob);
                qrDisplay.classList.remove('hidden');
            } else {
                alert('Failed to load QR code');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy link');
            });
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
            } catch (error) {
                console.error('Logout request failed:', error);
            } finally {
                localStorage.removeItem('user_panel_token');
                accessToken = null;
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
                document.getElementById('username').value = '';
                document.getElementById('subscriptionKey').value = '';
            }
        }
    </script>
</body>
</html>
